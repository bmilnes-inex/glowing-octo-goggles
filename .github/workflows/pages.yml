name: Deploy Blunderboard to GitHub Pages

on:
  push:
    branches:
      - claude/chess-win-tracker-app-w8wev2
      - claude/workspace-migration-ft3Un
      - main
    paths:
      - 'chess/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: chess
      - id: deployment
        uses: actions/deploy-pages@v4
